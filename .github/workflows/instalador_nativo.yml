name: Compilar APK Iglesia Estable
on:
  push:
    branches: [ principal, main ]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # REPARADO: Añadimos la descarga oficial del SDK de Flutter requerida por Flet
      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # Versión ideal compatible con Flet 0.22.0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet Estable Fijo
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Compilar Aplicación Android (.apk)
        run: |
          export FLUTTER_NO_INTERACTIVE=true
          echo "y" | flet build apk

      - name: Guardar Instalador Listo
        uses: actions/upload-artifact@v4
        with:
          name: App_Iglesia_Celular
          path: build/apk/*.apk
