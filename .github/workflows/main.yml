name: Compilar APK Iglesia
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java y Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # Versión estable compatible con Flet
      - name: Instalar Python y Flet
        run: |
          pip install flet
      - name: Crear Aplicación Android (.apk)
        run: |
          flet build apk --icon logo.png
      - name: Guardar Instalador Listo
        uses: actions/upload-artifact@v4
        with:
          name: App_Iglesia_Celular
          path: build/apk/*.apk
